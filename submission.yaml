submission:
  title: "PortWise AI — Container Congestion Predictor & Port Operations Optimizer"

  problem_statement: >
    Terminal operators at major ports face severe vessel congestion and cascading demurrage
    delays due to fragmented monitoring tools and lack of predictive visibility into berth/crane bottlenecks.

  solution_summary: >
    PortWise AI is an intelligent operations dashboard providing real-time AIS telemetry,
    a 72-hour congestion forecast bar chart, dynamic berth saturation matrices, and an integrated
    IBM Bob AI Copilot for automated vessel rerouting and conflict optimization.

  key_features:
    - "72-Hour Predictive Congestion Bar Chart with Congestion Index and Wait Time views"
    - "Live AIS Port Map Telemetry with vessel status pins and anchorage monitoring"
    - "Berth Saturation Matrix and Gantry Crane Utilization Tracker"
    - "Interactive AI Copilot for dynamic vessel rerouting and shift optimizations"
    - "Instant Single-Click Operations Status and PDF Report Generator"

  tech_stack:
    languages: ["TypeScript", "JavaScript", "HTML", "CSS"]
    frameworks: ["Next.js 16 (App Router)", "React 19", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob", "watsonx.ai"]
    databases: ["Zustand In-Memory State Store"]
    other: ["Groq LLaMA-3.3 / GPT-OSS Engine", "Lucide React", "Turbopack", "Vercel"]

  what_we_are_most_proud_of: >
    The seamless integration between the interactive 72-hour predictive forecast UI,
    geospatial port map telemetry, and real-time AI Copilot recommendation engine that enables
    port supervisors to make immediate, proactive operational decisions.

  known_limitations: >
    Live telemetry currently uses simulated AIS stream feeds based on Los Angeles / Long Beach historical port patterns.

